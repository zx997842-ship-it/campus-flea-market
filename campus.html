<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>校园集市 · 校区</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* 顶部定位栏 */
    .campus-top {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 16px;
    }
    .campus-loc-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .campus-loc {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
    }
    .campus-loc svg { width: 20px; height: 20px; color: var(--primary); }
    .campus-loc .arrow { width: 16px; height: 16px; color: var(--text-sub); }
    .icon-btn {
      width: 36px; height: 36px;
      display: flex; align-items: center; justify-content: center;
      color: var(--text);
      flex-shrink: 0;
    }

    /* 排序栏 */
    .sort-bar {
      display: flex;
      gap: 20px;
      padding: 12px 16px;
      background: var(--surface);
    }
    .sort-item {
      font-size: 12px;
      color: var(--text-sub);
      cursor: pointer;
      transition: color 0.15s, font-weight 0.15s;
      display: flex;
      align-items: center;
      gap: 2px;
    }
    .sort-item svg { width: 12px; height: 12px; }
    .sort-item--active {
      color: var(--primary);
      font-weight: 700;
    }

    /* 商品列表 */
    .item-list {
      padding: 0 16px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .campus-item {
      display: flex;
      gap: 12px;
      background: var(--surface);
      border-radius: var(--radius-lg);
      padding: 12px;
      transition: transform 0.15s;
    }
    .campus-item:active { transform: scale(0.98); }
    .campus-item__img {
      width: 100px;
      height: 100px;
      border-radius: var(--radius-md);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .campus-item__img svg { width: 28px; height: 28px; opacity: 0.5; color: #FFF; }
    .campus-item__info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .campus-item__title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .campus-item__bottom {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
    }
    .campus-item__price {
      font-size: 18px;
      font-weight: 700;
      color: var(--accent);
    }
    .campus-item__price .unit { font-size: 12px; }
    .campus-item__meta {
      text-align: right;
    }
    .campus-item__area {
      font-size: 12px;
      color: var(--primary);
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 2px;
    }
    .campus-item__area svg { width: 12px; height: 12px; }
    .campus-item__loc {
      font-size: 11px;
      color: var(--text-tertiary);
      margin-top: 3px;
    }
  </style>
</head>
<body data-page="campus">
  <div class="phone-frame">

    <!-- 顶部定位栏 -->
    <div class="campus-top">
      <div class="campus-loc-bar">
        <div class="campus-loc" id="locText">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
          <span>南京林业大学新庄校区</span>
          <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
        </div>
        <div class="icon-btn" id="searchBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="22" height="22"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        </div>
      </div>
    </div>

    <!-- 排序栏 -->
    <div class="sort-bar">
      <div class="sort-item sort-item--active" data-sort="latest">
        最新发布
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 15 5 5 5-5"/><path d="m7 9 5-5 5 5"/></svg>
      </div>
      <div class="sort-item" data-sort="price">价格最低</div>
      <div class="sort-item" data-sort="hot">最多浏览</div>
    </div>

    <!-- 商品列表 -->
    <main class="page-content page-enter">
      <div class="item-list" id="itemList"></div>
    </main>

    <!-- Tab Bar -->
    <nav class="tab-bar">
      <a href="index.html" data-nav="home" class="tab-item">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span class="tab-label">首页</span>
      </a>
      <a href="campus.html" data-nav="campus" class="tab-item">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
        <span class="tab-label">校区</span>
      </a>
      <a href="publish.html" data-nav="publish" class="tab-item tab-item--publish">
        <div class="tab-publish-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
        </div>
        <span class="tab-label">发布</span>
      </a>
      <a href="messages.html" data-nav="messages" class="tab-item">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>
        <span class="tab-label">消息</span>
        <span class="tab-badge">3</span>
      </a>
      <a href="profile.html" data-nav="profile" class="tab-item">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span class="tab-label">我的</span>
      </a>
    </nav>
  </div>

  <script src="mock.js"></script>
  <script src="api.js"></script>
  <script>
    // 校区商品数据
    var campusItems = [
      { id: 1, title: 'iPad Air 5 64G WiFi版 深空灰', price: 2800, campus: '新庄校区', image: 'assets/images/item-02-ipad.jpg', gradClass: '', category: '数码', views: 342 },
      { id: 2, title: '高等数学同济第八版 几乎全新', price: 15, campus: '新庄校区', image: 'assets/images/item-01-math-book.jpg', gradClass: '', category: '教材', views: 128 },
      { id: 3, title: '罗技G304无线鼠标 黑色 95新', price: 139, campus: '新庄校区', image: 'assets/images/item-202-mouse.jpg', gradClass: '', category: '数码', views: 245 },
      { id: 4, title: '优衣库羽绒服 男款L码 穿过两次', price: 299, campus: '新庄校区', image: 'assets/images/item-08-jacket.jpg', gradClass: '', category: '服饰', views: 189 },
      { id: 5, title: '宿舍护眼小台灯 三档调光', price: 25, campus: '新庄校区', image: 'assets/images/item-04-lamp.jpg', gradClass: '', category: '生活', views: 98 },
      { id: 6, title: '六级真题+词汇 新东方', price: 25, campus: '新庄校区', image: 'assets/images/item-06-vocab.jpg', gradClass: '', category: '教材', views: 156 },
      { id: 7, title: 'YONEX羽毛球拍 天斧88D', price: 320, campus: '新庄校区', image: 'assets/images/item-05-racket.jpg', gradClass: '', category: '运动', views: 201 },
      { id: 8, title: 'Kindle Paperwhite 4 8G', price: 499, campus: '新庄校区', image: 'assets/images/item-09-kindle.jpg', gradClass: '', category: '数码', views: 312 },
    ];

    function esc(str) {
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function getCategoryIcon(cat) {
      var icons = {
        '数码': '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="3" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></svg>',
        '书籍': '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>',
        '服饰': '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20.38 3.46 16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z"/></svg>',
        '生活用品': '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9h18v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9Z"/><path d="M3 9V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v4"/><path d="M3 9h18"/><path d="M10 22V9"/></svg>',
      };
      return icons[cat] || icons['数码'];
    }

    var currentSort = 'latest';

    function renderItems() {
      var list = document.getElementById('itemList');
      var items = campusItems.slice();

      // 排序
      if (currentSort === 'price') {
        items.sort(function(a, b) { return a.price - b.price; });
      } else if (currentSort === 'hot') {
        items.sort(function(a, b) { return b.views - a.views; });
      } else {
        items.sort(function(a, b) { return b.id - a.id; });
      }

      var html = '';
      for (var i = 0; i < items.length; i++) {
        var item = items[i];
        var imgStyle = item.image ? 'background-image:url(' + item.image + ');background-size:cover;background-position:center;' : '';
        html += '<a href="detail.html?id=' + item.id + '" class="campus-item">'
          + '<div class="campus-item__img ' + item.gradClass + '" style="' + imgStyle + '">'
          + (item.image ? '' : getCategoryIcon(item.category))
          + '</div>'
          + '<div class="campus-item__info">'
          + '<div class="campus-item__title">' + esc(item.title) + '</div>'
          + '<div class="campus-item__bottom">'
          + '<div class="campus-item__price"><span class="unit">¥</span>' + item.price + '</div>'
          + '<div class="campus-item__meta">'
          + '<div class="campus-item__area">'
          + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>'
          + esc(item.campus)
          + '</div>'
          + '</div>'
          + '</div>'
          + '</div>'
          + '</a>';
      }
      list.innerHTML = html;
    }

    // 初始渲染
    renderItems();

    // 排序
    var sortItems = document.querySelectorAll('.sort-item');
    sortItems.forEach(function(item) {
      item.addEventListener('click', function() {
        sortItems.forEach(function(s) { s.classList.remove('sort-item--active'); });
        this.classList.add('sort-item--active');
        currentSort = this.getAttribute('data-sort');
        renderItems();
      });
    });
  </script>
</body>
</html>
