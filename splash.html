<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>校园集市</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* ===== 启动页 ===== */
    .splash-screen {
      position: absolute;
      inset: 0;
      background: #FFFFFF;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      animation: splashFadeOut 0.5s ease 2.0s forwards;
    }
    .splash-logo-wrap {
      width: 100px;
      height: 100px;
      border-radius: 24px;
      background: #111111;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 36px rgba(0,0,0,0.12);
      margin-bottom: 26px;
      animation: logoBounce 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s both;
    }
    .splash-logo-wrap svg {
      width: 52px;
      height: 52px;
      color: #FFFFFF;
    }
    .splash-title {
      font-size: 26px;
      font-weight: 700;
      color: #1A1A1A;
      letter-spacing: 3px;
      margin-bottom: 8px;
      animation: fadeUp 0.6s ease 0.5s both;
    }
    .splash-subtitle {
      font-size: 14px;
      color: #999999;
      letter-spacing: 2px;
      animation: fadeUp 0.6s ease 0.7s both;
    }
    .splash-footer {
      position: absolute;
      bottom: 40px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 12px;
      color: #CCCCCC;
      letter-spacing: 1px;
      animation: fadeUp 0.6s ease 1.0s both;
    }

    @keyframes splashFadeOut {
      to { opacity: 0; pointer-events: none; }
    }
    @keyframes logoBounce {
      0% { opacity: 0; transform: scale(0.6); }
      100% { opacity: 1; transform: scale(1); }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="phone-frame">
    <div class="splash-screen">
      <div class="splash-logo-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/>
          <path d="M3 6h18"/>
          <path d="M16 10a4 4 0 0 1-8 0"/>
          <circle cx="12" cy="16" r="1.5" fill="currentColor" stroke="none"/>
        </svg>
      </div>
      <div class="splash-title">校园集市</div>
      <div class="splash-subtitle">校园闲置 · 轻松交易</div>
      <div class="splash-footer">Campus Flea Market</div>
    </div>
  </div>
  <script>
    setTimeout(function () {
      window.location.href = 'login.html';
    }, 2200);
  </script>
</body>
</html>
